<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NaturalHeal AI</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2E7D5B">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NaturalHeal">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Mulish:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#F2F5F0;--surface:#FFFFFF;--surface-2:#EAF0E8;--fg:#1E2823;--muted:#5C6B61;--line:#D9E2D6;
  --accent:#2E7D5B;--accent-soft:#DCEDE3;--accent-ink:#1C5A3E;--gold:#B07D22;--gold-soft:#F4E9CE;
  --vata:#6C8EBF;--pitta:#C77D3A;--kapha:#4F9D6B;--danger:#B23A32;
  --shadow:0 1px 2px rgba(30,40,35,.05),0 8px 24px rgba(30,40,35,.06);--r:14px;
  --f-head:"Fraunces",Georgia,serif;--f-body:"Mulish","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10140F;--surface:#191E16;--surface-2:#222A1F;--fg:#E7EDE6;--muted:#9BA99F;--line:#2C3528;
  --accent:#58B98B;--accent-soft:#1E2D24;--accent-ink:#9FE0BE;--gold:#D7A94B;--gold-soft:#2A2415;
  --danger:#E6786F;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);color-scheme:dark;
}}
*{box-sizing:border-box}
html{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);line-height:1.6;overflow-x:hidden;max-width:100vw}
img,svg,video,canvas{max-width:100%}
.wrap{max-width:820px;margin:0 auto;padding:22px 18px calc(104px + env(safe-area-inset-bottom));overflow-x:hidden}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.leaf{width:40px;height:40px;border-radius:12px;background:var(--accent);display:grid;place-items:center;flex:none}
.leaf svg{width:24px;height:24px}
.brand h1{font-family:var(--f-head);font-weight:600;font-size:26px;margin:0}
.brand .tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.controls{margin-left:auto;display:flex;gap:8px;align-items:center}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.lang button{border:none;background:transparent;color:var(--muted);font:inherit;font-weight:800;font-size:13px;padding:7px 11px;cursor:pointer}
.lang button.on{background:var(--accent);color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
.card+.card{margin-top:16px}
.card h2{font-family:var(--f-head);font-weight:600;font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
input,select,textarea{width:100%;font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-family:var(--f-body)}
textarea{resize:vertical;min-height:58px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:8px 13px;border:1px solid var(--line);border-radius:999px;font-size:13.5px;font-weight:600;background:var(--bg);cursor:pointer;user-select:none}
.chip input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.btn{border:none;cursor:pointer;font-family:var(--f-body);font-weight:800;font-size:15px;padding:13px 18px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--accent);color:#fff;width:100%}
.btn-gold{background:var(--gold);color:#201500}
.btn-ghost{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.btn[disabled]{opacity:.6;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.row>.btn{flex:1;min-width:150px}
.err{color:var(--danger);font-size:13px;font-weight:600;margin-top:10px;min-height:1px}
.link{color:var(--accent);font-weight:700;cursor:pointer;background:none;border:none;font:inherit}
.hidden{display:none}
body.big{zoom:1.18}
.listen-btn{background:var(--accent-soft);color:var(--accent-ink);border:none;border-radius:999px;padding:7px 13px;font-weight:800;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
#bigBtn{background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:10px;width:38px;height:38px;cursor:pointer;font-weight:800;font-size:16px;flex:none}
.chip span{font-size:15px}
/* Asaan Report findings (red/green bars) */
.finding{padding:11px 0;border-bottom:1px solid var(--line)}
.finding:last-child{border-bottom:none}
.f-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.f-name{font-weight:800;font-size:14.5px}
.f-val{font-weight:800;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px 9px;white-space:nowrap}
.f-track{height:12px;border-radius:999px;background:var(--surface-2);margin:8px 0 6px;overflow:hidden}
.f-fill{height:100%;border-radius:999px;transition:width .5s}
.f-say{font-size:13.5px;font-weight:700}
/* Kitchen remedy */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px;margin-top:6px}
.kitem input{position:absolute;opacity:0;pointer-events:none}
.kitem span{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 6px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);cursor:pointer;font-weight:700;font-size:13px;text-align:center}
.kitem .ke{font-size:28px;line-height:1}
.kitem input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.krem{background:var(--accent-soft);border:1px solid var(--accent);border-radius:14px;padding:14px;margin-top:8px}
.krem h4{margin:0 0 4px;font-size:15.5px}
.krem .kuses{font-size:12px;color:var(--accent-ink);font-weight:700;margin-top:4px}
.kscan{margin-top:18px;padding:14px;border:1.5px dashed var(--accent);border-radius:14px;background:var(--accent-soft)}
.kscan-t{font-weight:800;font-size:14.5px;margin-bottom:4px}
.kfound{font-size:13.5px;font-weight:700;color:var(--accent-ink);background:var(--bg);border-radius:10px;padding:8px 10px;margin-bottom:10px}
.kcam{margin-top:16px;padding:16px;border:1.5px dashed var(--accent);border-radius:16px;background:var(--accent-soft)}
.kvideo{width:100%;max-height:300px;border-radius:12px;background:#000;object-fit:cover;display:block}
.kbenefit{font-size:14px;background:var(--accent-soft);color:var(--accent-ink);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.invite-card{margin-top:16px;padding:18px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent-ink));color:#fff;text-align:center;box-shadow:var(--shadow)}
.invite-card .inv-emoji{font-size:40px;line-height:1}
.invite-card .inv-h{font-family:var(--f-head);font-size:20px;font-weight:600;margin-top:6px}
.invite-card .inv-sub{font-size:13.5px;opacity:.92;margin:6px 0 14px}
.invite-card .inv-link{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);border-radius:10px;padding:10px 12px;font-weight:700;font-size:13.5px;word-break:break-all}
.invite-card .inv-link span{flex:1;text-align:left}
.invite-card .inv-link button{flex:none;background:#fff;color:var(--accent-ink);border:none;border-radius:8px;width:34px;height:34px;font-size:16px;cursor:pointer;font-weight:800}
.invite-card .inv-row{display:flex;gap:10px;margin-top:12px}
.invite-card .inv-row .btn{flex:1}
.invite-card .inv-row .btn-ghost{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.35)}
.invite-card .inv-stat{margin-top:12px;font-weight:800;font-size:13.5px;background:rgba(255,255,255,.14);display:inline-block;padding:5px 14px;border-radius:999px}
.streak-share{margin-top:10px;width:100%;background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold);border-radius:12px;padding:10px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit}
.pts-card{margin-top:16px;display:flex;align-items:center;gap:12px;background:var(--gold-soft);border:1px solid var(--gold);border-radius:16px;padding:14px 16px;cursor:pointer}
.pts-card .pts-l{flex:1}
.pts-card .pts-k{font-size:12px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:.04em}
.pts-card .pts-v{font-size:28px;font-weight:800;font-family:var(--f-head);color:var(--fg)}
.pts-card .pts-v span{font-size:20px}
.pts-card .btn{flex:none;background:var(--gold);color:#fff;border:none}
.pt-sheet .pt-bal{text-align:center;font-size:40px;font-weight:800;font-family:var(--f-head);color:var(--accent-ink)}
.pt-sheet .pt-bal span{display:block;font-size:13px;font-weight:700;color:var(--muted);font-family:var(--f-body);text-transform:uppercase;letter-spacing:.05em}
.pt-h{font-family:var(--f-head);font-weight:600;font-size:16px;margin:18px 0 8px}
.pt-redeem{display:flex;flex-direction:column;gap:10px}
.pt-opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px}
.pt-opt>div:first-child{flex:1}
.pt-opt .sub{font-size:12px}
.qr-poster{text-align:center;background:linear-gradient(165deg,var(--accent-soft),var(--surface));border-radius:16px;padding:18px 12px}
.qr-badge{display:inline-block;background:var(--accent);color:#fff;font-weight:800;font-size:13px;padding:5px 14px;border-radius:999px;letter-spacing:.03em}
.qr-h{font-family:var(--f-head);font-weight:600;font-size:21px;margin:12px 0 10px;color:var(--accent-ink)}
.qr-benes{display:inline-block;text-align:left;font-size:14px;font-weight:600;line-height:1.9;margin-bottom:14px}
.qr-box{background:#fff;border-radius:16px;padding:14px;display:inline-block;box-shadow:var(--shadow)}
.qr-cta{margin-top:12px;font-weight:800;color:#fff;background:var(--gold);display:inline-block;padding:9px 18px;border-radius:999px;font-size:15px}
.pt-earn,.pt-led{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}
.pt-led b.pos{color:var(--accent)}.pt-led b.neg{color:var(--danger)}
.home-stat{font-weight:800;font-size:13.5px;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:7px 14px;margin-top:12px;text-align:center}
.home-stat:empty{display:none}
.testi-wrap{display:flex;flex-direction:column;gap:10px}
.testi{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:13px 15px;cursor:pointer}
.testi-q{font-size:14.5px;font-style:italic}
.testi-a{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:6px}
.post.post-hl{outline:3px solid var(--accent);outline-offset:2px;transition:outline .3s}
.sheet-bg{position:fixed;inset:0;background:rgba(20,26,22,.55);z-index:70;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:var(--shadow);animation:sheetUp .22s ease}
@media(min-width:560px){.sheet-bg{align-items:center}.sheet{border-radius:20px}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4}to{transform:translateY(0);opacity:1}}
/* Community */
.post{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px;box-shadow:var(--shadow)}
.post .ph{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:700}
.post .ptag{background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:2px 9px;font-size:11.5px}
.post h4{margin:8px 0 5px;font-size:16px}
.post .pbody{font-size:14px;line-height:1.55;white-space:pre-wrap}
.post .pacts{display:flex;gap:14px;margin-top:11px;font-size:13px;font-weight:700}
.post .pacts button{background:none;border:none;color:var(--muted);cursor:pointer;font:inherit;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.post .pacts button.on{color:var(--accent)}
/* bottom tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;z-index:40;padding:8px 0 calc(10px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(30,40,35,.06)}
.tabbtn{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font:inherit;font-size:11px;font-weight:700}
.tabbtn .ti{font-size:20px;opacity:.55}
.tabbtn.on{color:var(--accent)}
.tabbtn.on .ti{opacity:1}
/* dashboard */
.dash-hero{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:18px 20px;display:flex;gap:14px;align-items:center}
.dh-l{flex:1;min-width:0}
.dh-k{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)}
.dh-t{font-size:18px;font-weight:800;margin:3px 0 10px;color:var(--text)}
.dh-score{width:78px;height:78px;border-radius:50%;border:7px solid var(--accent);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.dh-score b{font-size:24px;font-weight:800;color:var(--accent-ink)}
.dh-score span{font-size:10px;color:var(--muted)}
.d-pills{display:flex;flex-wrap:wrap;gap:6px}
.d-pill{display:flex;align-items:center;gap:5px;background:var(--surface);border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;text-transform:capitalize}
.d-stats{display:flex;gap:10px;margin-top:14px}
.d-stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center}
.d-stat b{display:block;font-size:20px;font-weight:800}
.d-stat span{font-size:11px;color:var(--muted);font-weight:700}
.d-bars{display:flex;justify-content:space-between;align-items:flex-end;height:92px;margin-top:6px}
.d-bar{flex:1;display:flex;flex-direction:column;align-items:center}
.d-track{width:12px;height:72px;background:var(--surface-2);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}
.d-fill{width:100%;border-radius:6px}
.d-bl{font-size:10px;color:var(--muted);margin-top:5px;font-weight:700}
.insight{background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:14px 16px;display:flex;gap:10px;align-items:flex-start;margin-top:12px}
.insight svg{width:18px;height:18px;flex:none;color:var(--gold);margin-top:1px}
.insight .it{font-size:14px;line-height:1.5}
/* tracker */
.sev-row{display:flex;gap:9px;margin-top:4px}
.sev-dot{flex:1;aspect-ratio:1;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;font-weight:800;cursor:pointer;background:transparent;font-size:17px}
.log-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.log-row:last-child{border:none}
.sev-badge{width:32px;height:32px;border-radius:16px;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
/* member select */
#memberSel{font:inherit;font-weight:700;font-size:13px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 8px;max-width:130px}
/* season / progress / reminder cards */
.mini-card{border-radius:14px;padding:14px 16px;margin-top:12px;border:1px solid}
.c-season{background:var(--accent-soft);border-color:var(--accent)}
.c-progress{background:var(--surface);border-color:var(--line)}
.c-adjust{background:var(--gold-soft);border-color:var(--gold)}
.mc-h{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 5px}
.mc-b{font-size:14px;line-height:1.5;margin:0}
.prog-big{font-size:26px;font-weight:800;font-family:var(--f-head)}
.why-btn{font-size:11px;font-weight:800;color:var(--accent);background:var(--accent-soft);border:none;border-radius:999px;padding:3px 9px;cursor:pointer;margin-left:8px}
.mic{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;cursor:pointer;display:grid;place-items:center;flex:none}
.mic.rec{background:var(--danger);border-color:var(--danger);color:#fff}
.mic svg{width:18px;height:18px}
.inrow{display:flex;gap:8px;align-items:center}
.inrow input{flex:1}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,26,22,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px;max-height:82vh;overflow-y:auto}
@media(min-width:560px){.modal-bg{align-items:center}.modal{border-radius:18px}}
.modal h3{font-family:var(--f-head);font-size:19px;margin:0 0 10px}
/* chat */
.fab{position:fixed;right:16px;bottom:74px;background:var(--accent);color:#fff;border:none;border-radius:999px;padding:12px 16px;font-weight:800;font-size:14px;box-shadow:var(--shadow);z-index:45;cursor:pointer;display:flex;align-items:center;gap:7px}
.fab svg{width:18px;height:18px}
.chat-log{display:flex;flex-direction:column;gap:9px;margin:4px 0 12px;max-height:46vh;overflow-y:auto}
.bub{padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.5;max-width:85%}
.bub.u{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.bub.a{background:var(--surface-2);color:var(--fg);align-self:flex-start;border-bottom-left-radius:4px}
.tappable{cursor:pointer}
.hdr-user{font-size:13px;color:var(--muted)}
/* plan */
.summary{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:18px 20px}
.badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--surface);border:1px solid var(--accent);padding:3px 9px;border-radius:999px;margin-bottom:8px}
.summary h2{font-family:var(--f-head);color:var(--accent-ink);margin:0 0 6px;font-size:21px}
.summary p{margin:0}
.stats{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 13px}
.stat .k{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat .v{font-size:17px;font-weight:800}
.sec-h{font-family:var(--f-head);font-size:18px;font-weight:600;margin:0 0 12px;display:flex;align-items:center;gap:9px}
.dosha-bars{display:grid;gap:9px;margin-bottom:12px}
.dbar{display:flex;align-items:center;gap:10px;font-size:13px}
.dbar .nm{width:58px;font-weight:700;text-transform:capitalize}
.dbar .track{flex:1;height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.dbar .fill{height:100%;border-radius:999px}
.dbar .pc{width:38px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
ul.items{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.items li{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14.5px}
ul.items li b{color:var(--accent-ink)}
.supp{display:grid;gap:10px}
.supp .s{background:var(--surface-2);border-radius:11px;padding:12px 14px;border-left:3px solid var(--accent)}
.supp .s .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.supp .s .name{font-weight:800}
.supp .s .pill{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--accent-ink);background:var(--accent-soft);padding:2px 8px;border-radius:999px}

.routine-line{position:absolute;left:36px;top:24px;bottom:24px;width:2px;background:var(--line)}
.r-row{position:relative;display:flex;gap:14px;align-items:flex-start;padding:7px 0;z-index:1}
.r-dot{flex:none;width:44px;height:44px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);display:grid;place-items:center;font-size:21px;box-shadow:0 2px 6px rgba(30,40,35,.08)}
.r-body{flex:1;padding-top:3px}
.r-time{font-weight:800;color:var(--accent-ink);font-size:13px}
.r-act{font-size:15px;font-weight:600;margin-top:1px}
.redflag{background:#fdeceb;border:1px solid var(--danger);border-radius:12px;padding:13px 15px;margin-top:14px}
@media(prefers-color-scheme:dark){.redflag{background:#2a1512}}
.redflag b{color:var(--danger)}
.disc{margin-top:14px;background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:13px 15px;font-size:13px}
.disc b{color:var(--gold)}
.plist{display:grid;gap:9px}
.pitem{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface-2);border-radius:10px;padding:11px 13px;cursor:pointer}
.pitem .ti{font-weight:700;font-size:14px}

.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:var(--shadow);z-index:50}
.icon{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.icon svg{width:17px;height:17px}
</style>

<script>
const API="/api";
let lang=localStorage.getItem("nh_lang")||"hi";
let token=localStorage.getItem("nh_token")||null;
let me=null, authMode="login", feats=null, pricing=null, member=null, membersList=[];
const $=id=>document.getElementById(id);
function memberQ(){return member?("&member="+encodeURIComponent(member)):"";}

/* ===== Accessibility: sabke liye (anpad/padhe-likhe, sab) ===== */
const CEMO={acidity:"🔥",stress:"😣",sleep:"😴",fatigue:"🥱",cold:"🤧",joint:"🦵",constipation:"🚽",headache:"🤕",bp:"💓",weight:"⚖️",skin:"✨",hair:"💇",immunity:"🛡️",diabetes:"🍬",periods:"🌸",thyroid:"🦋",backpain:"🧍",eyes:"👀",cholesterol:"🫀",anemia:"🩸"};
const SEMO={"Acidity":"🔥","Sir dard":"🤕","Thakaan":"🥱","Neend":"😴","Jodo ka dard":"🦵","Stress":"😣","Gas":"💨","Sardi-khaansi":"🤧","Kabz":"🚽"};
const TTS="speechSynthesis" in window;
let speaking=false;
let _voices=[];
function loadVoices(){try{_voices=window.speechSynthesis.getVoices()||[];}catch(e){_voices=[];}}
if(TTS){loadVoices();try{window.speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}}
function pickVoice(){
 if(!_voices.length)loadVoices();
 const want=lang==="hi"?"hi":"en";
 // sabse acchi: hi-IN / en-IN; Google/Microsoft natural voices ko prefer karo
 const score=(v)=>{let s=0;const l=(v.lang||"").toLowerCase(),n=(v.name||"").toLowerCase();
   if(want==="hi"){if(l.startsWith("hi"))s+=10;}else{if(l==="en-in")s+=10;else if(l.startsWith("en"))s+=6;}
   if(/google/.test(n))s+=4;if(/natural|neural|online/.test(n))s+=3;if(/female|woman|swara|heera|kalpana/.test(n))s+=1;return s;};
 let best=null,bs=-1;_voices.forEach(v=>{const s=score(v);if(s>bs){bs=s;best=v;}});
 return bs>0?best:null;
}
function speak(text){if(!TTS||!text)return;try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text).slice(0,4000));const v=pickVoice();if(v){u.voice=v;u.lang=v.lang;}else{u.lang=lang==="hi"?"hi-IN":"en-IN";}u.rate=.9;u.pitch=1.02;u.onend=()=>{speaking=false;};window.speechSynthesis.speak(u);speaking=true;}catch(e){}}
function stopSpeak(){try{window.speechSynthesis.cancel();speaking=false;}catch(e){}}
function toggleSpeak(text){if(speaking){stopSpeak();}else{speak(text);}}
/* bade akshar mode */
function applyBig(){try{const on=localStorage.getItem("nh_big")==="1";document.body.classList.toggle("big",on);const b=$("bigBtn");if(b)b.style.background=on?"var(--accent-soft)":"var(--surface)";}catch(e){}}
function toggleBig(){try{localStorage.setItem("nh_big",localStorage.getItem("nh_big")==="1"?"0":"1");}catch(e){}applyBig();}
let brandBlurb={hi:null,en:null};
function pwhy(){return (brandBlurb[lang]||t().premiumWhy);}
function applyBranding(){
 if(!pricing)return;
 if(pricing.app_name){$("brandName").textContent=pricing.app_name;document.title=pricing.app_name;}
 brandBlurb.hi=pricing.blurb_hi||null;brandBlurb.en=pricing.blurb_en||null;
 try{renderStatic();}catch(e){}
}

/* ===== Members (F3) ===== */
async function loadMembers(){
 try{const d=await api("/members");membersList=d.members||[];
  if(!member||!membersList.find(m=>m.id===member)){const self=membersList.find(m=>m.relation==="self");member=self?self.id:(membersList[0]&&membersList[0].id);}
  const sel=$("memberSel");const x=t();
  sel.innerHTML=membersList.map(m=>`<option value="${m.id}" ${m.id===member?"selected":""}>${m.relation==="self"?x.mMine:esc(m.name)}</option>`).join("")+`<option value="__add">${x.mAdd}</option>`;
  sel.classList.remove("hidden");
 }catch(e){}
}
function onMemberChange(){
 const v=$("memberSel").value;
 if(v==="__add"){$("memberSel").value=member;openMembersModal();return;}
 member=v;
 if(curTab==="home")loadDashboard(); else if(curTab==="track")loadTracker();
}
function genderLabel(g){const x=t();return g==="male"?x.gMale:g==="female"?x.gFemale:g==="other"?x.gOther:"";}
function genOpts(){const x=t();return `<option value="">${x.gSel}</option><option value="male">${x.gMale}</option><option value="female">${x.gFemale}</option><option value="other">${x.gOther}</option>`;}
function openMembersModal(){const x=t();
 const rows=membersList.map(m=>`<div class="log-row"><div style="flex:1;min-width:0"><div style="font-weight:700">${esc(m.name)}${m.relation==="self"?` <span class="sub">(${x.mMine})</span>`:""}</div><div class="sub">${esc(m.relation||"")}${m.gender?" · "+esc(genderLabel(m.gender)):""}${m.age?" · "+m.age:""}</div></div>${m.relation==="self"?"":`<button class="link" data-medit="${m.id}" style="font-size:16px">✎</button><button class="link del" data-mdel="${m.id}" style="font-size:15px;margin-left:6px">✕</button>`}</div>`).join("");
 openModal(`<h3>${x.mManage}</h3>
  <div style="margin-bottom:14px">${rows}</div>
  <div style="border-top:1px solid var(--line);padding-top:14px">
   <label>${x.mAddName}</label><input id="amName">
   <div class="grid" style="margin-top:8px">
     <div><label>${x.mAddRel}</label><input id="amRel"></div>
     <div><label>${x.gender}</label><select id="amGen">${genOpts()}</select></div>
   </div>
   <label style="margin-top:8px">${x.age}</label><input id="amAge" type="number">
   <button class="btn btn-primary" id="amSave" style="width:100%;margin-top:12px">${x.mAddBtn}</button>
  </div>
  <button class="link" id="amClose" style="margin-top:12px">${x.close}</button>`);
 $("amClose").onclick=closeModal;
 $("amSave").onclick=async()=>{const name=$("amName").value.trim();if(!name)return;
  try{const r=await api("/members",{method:"POST",body:JSON.stringify({name,relation:$("amRel").value.trim()||"family",gender:$("amGen").value,age:+$("amAge").value||null})});
   member=r.member.id;pointToast(r);closeModal();await loadMembers();loadDashboard();}catch(e){toast(e.message);}};
 $("modalRoot").querySelectorAll("[data-medit]").forEach(b=>b.onclick=()=>openEditMember(b.dataset.medit));
 $("modalRoot").querySelectorAll("[data-mdel]").forEach(b=>b.onclick=async()=>{if(!confirm(x.mDelAsk))return;try{await api("/members/"+b.dataset.mdel,{method:"DELETE"});if(member===b.dataset.mdel)member=null;await loadMembers();openMembersModal();loadDashboard();}catch(e){toast(e.message);}});
}
function openEditMember(id){const x=t();const m=membersList.find(z=>z.id===id);if(!m)return;
 openModal(`<h3>${x.mEdit}</h3>
  <label>${x.mAddName}</label><input id="emName" value="${esc(m.name)}">
  <div class="grid" style="margin-top:8px">
    <div><label>${x.mAddRel}</label><input id="emRel" value="${esc(m.relation||"")}"></div>
    <div><label>${x.gender}</label><select id="emGen">${genOpts()}</select></div>
  </div>
  <label style="margin-top:8px">${x.age}</label><input id="emAge" type="number" value="${m.age||""}">
  <button class="btn btn-primary" id="emSave" style="width:100%;margin-top:12px">${x.mAddBtn}</button>
  <button class="link" id="emBack" style="margin-top:12px">${x.close}</button>`);
 $("emGen").value=m.gender||"";
 $("emBack").onclick=()=>openMembersModal();
 $("emSave").onclick=async()=>{try{await api("/members/"+id,{method:"PUT",body:JSON.stringify({name:$("emName").value.trim()||m.name,relation:$("emRel").value.trim(),gender:$("emGen").value,age:+$("emAge").value||null})});await loadMembers();openMembersModal();loadDashboard();toast(x.updated);}catch(e){toast(e.message);}};
}

/* ===== Modal helper ===== */
function openModal(html){const r=$("modalRoot");r.innerHTML=`<div class="modal-bg" id="mbg"><div class="modal">${html}</div></div>`;
 $("mbg").addEventListener("click",e=>{if(e.target.id==="mbg")closeModal();});}
function closeModal(){$("modalRoot").innerHTML="";}

/* ===== Why-this explainer (F4) ===== */
async function openExplain(text){const x=t();
 openModal(`<h3>${icn("leaf")} ${esc(text)}</h3><div id="exBody" style="min-height:40px"><span class="spin" style="border-color:var(--accent-soft);border-top-color:var(--accent);display:inline-block;vertical-align:middle"></span> <span class="sub">${x.thinking}</span></div><button class="link" id="exClose" style="margin-top:14px">${x.close}</button>`);
 $("exClose").onclick=closeModal;
 try{const r=await api("/explain",{method:"POST",body:JSON.stringify({text,language:lang,member})});
  const el=$("exBody");if(el){el.innerHTML=`<p style="margin:0;color:var(--fg)">${esc(r.explanation)}</p>${r.source==="ai"?"":`<p class="sub" style="margin:10px 0 0;font-size:12px">💡 ${x.whyPremium}</p>`}`;}}catch(e){const el=$("exBody");if(el)el.textContent="—";}
}

/* ===== AI chat (F7) ===== */
let chatMsgs=[];
function openChat(){const x=t();
 openModal(`<h3>${x.chatOpen}</h3><div class="chat-log" id="chatLog"></div>
  <div class="inrow"><input id="chatIn" placeholder="${x.chatPh}"><button class="btn btn-primary" id="chatSend" style="padding:11px 16px">${x.chatSend}</button></div>
  <button class="link" id="chatClose" style="margin-top:10px">${x.close}</button>`);
 $("chatClose").onclick=closeModal;
 if(!chatMsgs.length)chatMsgs=[{role:"assistant",content:x.chatHi}];
 renderChat();
 const send=async()=>{const v=$("chatIn").value.trim();if(!v)return;$("chatIn").value="";
  chatMsgs.push({role:"user",content:v});renderChat();
  chatMsgs.push({role:"assistant",content:x.thinking});renderChat();
  try{const r=await api("/chat",{method:"POST",body:JSON.stringify({messages:chatMsgs.filter(m=>m.content!==x.thinking),language:lang,member})});
   chatMsgs[chatMsgs.length-1]={role:"assistant",content:r.reply};renderChat();}
  catch(e){chatMsgs[chatMsgs.length-1]={role:"assistant",content:e.message};renderChat();}};
 $("chatSend").onclick=send;
 $("chatIn").addEventListener("keydown",e=>{if(e.key==="Enter")send();});
}
function renderChat(){const el=$("chatLog");if(!el)return;
 el.innerHTML=chatMsgs.map(m=>`<div class="bub ${m.role==="user"?"u":"a"}">${esc(m.content)}</div>`).join("");
 el.scrollTop=el.scrollHeight;}

/* ===== Voice input (F5) ===== */
function attachMic(btn,input){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){btn.style.display="none";return;}
 let rec=null,on=false;
 btn.onclick=()=>{
  if(on){rec&&rec.stop();return;}
  rec=new SR();rec.lang=lang==="hi"?"hi-IN":"en-US";rec.interimResults=false;
  rec.onresult=e=>{const txt=e.results[0][0].transcript;input.value=(input.value?input.value+" ":"")+txt;input.dispatchEvent(new Event("input"));};
  rec.onend=()=>{on=false;btn.classList.remove("rec");};
  rec.onerror=()=>{on=false;btn.classList.remove("rec");};
  on=true;btn.classList.add("rec");rec.start();
 };
}
const MIC_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10a7 7 0 0 1-14 0M12 17v4"/></svg>';

/* ===== Reminders (F8) ===== */
let remTimers=[];
function remindersOn(){try{return localStorage.getItem("nh_rem")==="1"&&"Notification" in window&&Notification.permission==="granted";}catch(e){return false;}}
async function enableReminders(routine){const x=t();
 if(!("Notification" in window)){toast(x.remNo);return;}
 let perm=Notification.permission;if(perm!=="granted")perm=await Notification.requestPermission();
 if(perm!=="granted")return;
 try{localStorage.setItem("nh_rem","1");}catch(e){}
 scheduleReminders(routine);toast(x.remOn);loadDashboard();
}
function scheduleReminders(routine){
 remTimers.forEach(clearTimeout);remTimers=[];
 if(!remindersOn()||!routine)return;
 const nowM=new Date();
 routine.forEach(r=>{const tm=parseTime(r.time);if(tm==null)return;
  const when=new Date();when.setHours(Math.floor(tm/60),tm%60,0,0);
  let ms=when-nowM;if(ms<0)ms+=24*3600*1000; // kal ke liye
  if(ms<24*3600*1000){const id=setTimeout(()=>{try{new Notification("NaturalHeal AI 🌿",{body:r.activity});}catch(e){}},ms);remTimers.push(id);}});
}
function parseTime(s){const m=String(s).match(/(\d+):(\d+)\s*(AM|PM)?/i);if(!m)return null;let h=+m[1],mm=+m[2];const ap=(m[3]||"").toUpperCase();if(ap==="PM"&&h<12)h+=12;if(ap==="AM"&&h===12)h=0;return h*60+mm;}

async function api(path,opts={}){

 if(token)h.Authorization="Bearer "+token;
 const r=await fetch(API+path,{...opts,headers:{...h,...(opts.headers||{})}});

 try{
  let res;
  if(authMode==="login"){
   if(!email||!pass){$("authErr").textContent=x.errEmail;return;}
   res=await api("/auth/login",{method:"POST",body:JSON.stringify({email,password:pass})});
  }else{
   const name=$("rName").value.trim();
   if(!name||!email||!pass){$("authErr").textContent=x.errName;return;}
   res=await api("/auth/register",{method:"POST",body:JSON.stringify({name,email,password:pass,region:$("rRegion").value,ref:pendingRef()})});
   try{localStorage.removeItem("nh_ref");}catch(_){}
  }

  await loadMe();
 }catch(e){$("authErr").textContent=e.message;}
};

 "cholesterol":{hi:"Khoon ki charbi (cholesterol)",en:"Blood fat (cholesterol)"},

 "thyroid":{hi:"Thyroid",en:"Thyroid"},

};
function simpleMarker(name,l){const k=String(name||"").toLowerCase();for(const key in MARKERS){if(k.includes(key))return MARKERS[key][l];}return name;}
function statusMeta(status,x){
 const s=String(status||"").toLowerCase();
 if(s==="normal")return{c:"var(--accent)",pct:72,word:x.stNormal};
 if(s==="borderline")return{c:"#E0B23A",pct:50,word:x.stBorder};
 if(s==="low")return{c:"var(--danger)",pct:26,word:x.stLow};
 if(s==="high")return{c:"var(--danger)",pct:96,word:x.stHigh};
 return{c:"var(--muted)",pct:50,word:status};
}
function reportToSpeech(fArr,x,l){
 return x.hReport+". "+fArr.map(f=>`${simpleMarker(f.marker,l)} ${statusMeta(f.status,x).word}`).join(". ")+".";
}
function planToSpeech(pl,x){
 const p=[];
 if(pl.summary)p.push(pl.summary);
 const da=pl.dosha_analysis||{};
 if(da.primary_dosha)p.push(`${x.sDosha}: ${da.primary_dosha}. ${da.explanation||""}`);
 if((pl.supplements||[]).length){p.push(x.hSupp+".");pl.supplements.forEach(s=>p.push(`${s.name}. ${s.reason||""}`));}
 if((pl.home_remedies||[]).length){p.push(x.hRem+".");pl.home_remedies.forEach(r=>p.push(`${r.name}. ${r.how||""}`));}
 if(pl.diet){if((pl.diet.prefer||[]).length)p.push(`${x.prefer}: ${(pl.diet.prefer||[]).join(", ")}.`);if((pl.diet.avoid||[]).length)p.push(`${x.avoid}: ${(pl.diet.avoid||[]).join(", ")}.`);}
 if((pl.yoga||[]).length){p.push(x.hYoga+".");pl.yoga.forEach(y=>p.push(`${y.name}. ${y.benefit||""}`));}
 if((pl.lifestyle_tips||[]).length){p.push(x.hTip+".");pl.lifestyle_tips.forEach(i=>p.push(i));}
 if(pl.disclaimer)p.push(pl.disclaimer);
 return p.join(" ");
}

/* canvas share-card — anpad-friendly: bada emoji + kam text + link */
function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function wrapText(g,text,x,y,maxW,lh){const words=String(text||"").split(" ");let line="",yy=y;for(const w of words){const tt=line?line+" "+w:w;if(g.measureText(tt).width>maxW&&line){g.fillText(line,x,yy);line=w;yy+=lh;}else line=tt;}if(line)g.fillText(line,x,yy);return yy;}
function makeCardFile({emoji,title,lines}){
 return new Promise((resolve)=>{
  const W=1080,H=1080,c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");
  const grad=g.createLinearGradient(0,0,0,H);grad.addColorStop(0,"#2E7D5B");grad.addColorStop(1,"#1C5A3E");g.fillStyle=grad;g.fillRect(0,0,W,H);
  g.fillStyle="#ffffff";rrect(g,64,64,W-128,H-128,44);g.fill();
  g.textAlign="center";
  g.font="150px sans-serif";g.fillText(emoji||"🌿",W/2,310);
  g.fillStyle="#1C5A3E";g.font="700 58px Georgia, serif";wrapText(g,title||"",W/2,430,W-260,70);
  g.fillStyle="#1E2823";g.font="400 40px sans-serif";let y=560;(lines||[]).forEach(l=>{y=wrapText(g,l,W/2,y,W-280,54)+22;});
  g.fillStyle="#3C7D5B";g.font="italic 500 34px sans-serif";wrapText(g,shareTagline(),W/2,Math.min(y+30,H-240),W-300,44);
  g.fillStyle="#2E7D5B";g.font="700 44px sans-serif";g.fillText(appName(),W/2,H-168);
  g.fillStyle="#5C6B61";g.font="400 32px sans-serif";g.fillText(myRefLink().replace(/^https?:\/\//,"").slice(0,46),W/2,H-110);
  if(c.toBlob)c.toBlob(b=>resolve(b?new File([b],"naturalheal.png",{type:"image/png"}):null),"image/png");
  else resolve(null);
 });
}

function renderTracker(logs){

 const chips=TR_SYMPTOMS.map(s=>`<label class="chip"><input type="radio" name="trk" value="${esc(s)}" ${trkSel===s?"checked":""}><span>${(SEMO[s]?SEMO[s]+" ":"")}${esc(s)}</span></label>`).join("");

 // weekly bars from logs
 const byDay={};const W=["S","M","T","W","T","F","S"];const days=[];
 for(let i=6;i>=0;i--){const dt=new Date();dt.setDate(dt.getDate()-i);const key=dt.toISOString().slice(0,10);days.push({key,label:W[dt.getDay()]});}
 logs.forEach(l=>{const k=(l.created_at||"").slice(0,10);(byDay[k]=byDay[k]||[]).push(l.sev);});
 const bars=days.map(d=>{const a=byDay[d.key];const v=a?a.reduce((x,y)=>x+y,0)/a.length:0;return `<div class="d-bar"><div class="d-track"><div class="d-fill" style="height:${(v/5)*100}%;background:${SEV[Math.max(0,Math.round(v)-1)]||'var(--line)'}"></div></div><div class="d-bl">${d.label}</div></div>`;}).join("");

 $("viewTracker").innerHTML=`
   <h1 style="font-family:var(--f-head);font-size:24px;margin:12px 0 2px">${x.trkTitle}</h1>

     <label style="margin-top:16px">${x.trkNote}</label>
     <div class="inrow"><input id="trkNote" placeholder="${x.trkNotePh}"><button type="button" class="mic" id="trkMic" aria-label="voice">${MIC_SVG}</button></div>
     <div class="err" id="trkErr"></div>
     <button class="btn btn-primary" id="trkSave" style="width:100%;margin-top:14px">${x.trkSave}</button>
   </div>
   <h2 style="font-family:var(--f-head);font-size:18px;margin:22px 0 10px">${x.dTrend}</h2>
   <div class="card"><div class="d-bars">${bars}</div></div>
   <h2 style="font-family:var(--f-head);font-size:18px;margin:22px 0 10px">${x.trkRecent}</h2>
   <div class="card">${list}</div>
 `;
 $("trkChips").querySelectorAll('input[name="trk"]').forEach(r=>r.addEventListener("change",()=>{trkSel=r.value;}));
 $("sevRow").querySelectorAll(".sev-dot").forEach(el=>el.addEventListener("click",()=>{trkSev=+el.dataset.sev;renderTracker(logs);}));

     <div class="chips">${conc}</div>
     <div class="kcam">
       <div id="kCamPre" style="text-align:center">
         <div style="font-size:40px;line-height:1">📷</div>
         <div style="font-weight:800;font-size:15px;margin-top:4px">${x.kCamTitle}</div>
         <p class="sub" style="margin:4px 0 12px">${x.kCamHint}</p>
         <button class="btn btn-primary" id="kCamBtn" type="button">📷 ${x.kCamOpen}</button>
       </div>
       <div id="kCamLive" class="hidden">
         <video id="kVideo" playsinline autoplay muted class="kvideo"></video>
         <div class="row" style="justify-content:center;margin-top:10px">
           <button class="btn btn-primary" id="kCap" type="button">📸 ${x.kCapture}</button>
           <button class="btn btn-ghost" id="kCamClose" type="button">✕</button>
         </div>
       </div>
       <input type="file" id="kScanFile" accept="image/*" capture="environment" class="hidden">
     </div>
     <button class="link" id="kListToggle" type="button" style="margin-top:14px">${x.kOrList} ▾</button>
     <div id="kListWrap" class="hidden">
       <label style="margin-top:10px;display:block">${x.kHave}</label>
       <div class="kgrid">${items}</div>
       <button class="btn btn-ghost" id="kBtn" type="button" style="margin-top:14px;width:100%">${x.kFind}</button>
     </div>
     <div class="err" id="kErr"></div>
   </div>
   <div id="kResult"></div>`;
 $("viewKitchen").querySelectorAll('input[name="kconc"]').forEach(r=>r.onchange=()=>{kConcern=r.value;});
 $("viewKitchen").querySelectorAll('.kitem input').forEach(c=>c.onchange=()=>{c.checked?kSel.add(c.value):kSel.delete(c.value);});
 $("kBtn").onclick=findRemedy;
 $("kCamBtn").onclick=openCam;
 $("kCap").onclick=captureCam;
 $("kCamClose").onclick=closeCam;
 $("kScanFile").onchange=scanRemedy;
 $("kListToggle").onclick=()=>{$("kListWrap").classList.toggle("hidden");};
}
let kStream=null;
async function openCam(){
 const x=t();
 if(!kConcern){$("kErr").textContent=x.kPickC;return;}
 $("kErr").textContent="";
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$("kScanFile").click();return;}
 try{
   kStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
   const v=$("kVideo");if(v){v.srcObject=kStream;}
   $("kCamPre").classList.add("hidden");$("kCamLive").classList.remove("hidden");
 }catch(e){ $("kScanFile").click(); }
}
function closeCam(){try{if(kStream){kStream.getTracks().forEach(t=>t.stop());kStream=null;}}catch(e){}
 if($("kCamLive"))$("kCamLive").classList.add("hidden");if($("kCamPre"))$("kCamPre").classList.remove("hidden");}
async function captureCam(){
 const x=t();const v=$("kVideo");if(!v||!v.videoWidth){toast(x.kScanning);return;}
 const w=Math.min(1024,v.videoWidth),h=Math.round(v.videoHeight*(w/(v.videoWidth||1)));
 const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(v,0,0,w,h);
 const durl=cv.toDataURL("image/jpeg",0.8);const data=durl.slice(durl.indexOf(",")+1);
 const btn=$("kCap");btn.disabled=true;btn.textContent="📸 "+x.kScanning;
 try{const r=await api("/kitchen/scan",{method:"POST",body:JSON.stringify({concern:kConcern,image:{media_type:"image/jpeg",data},language:lang})});closeCam();renderKitchenResult(r);}
 catch(e){$("kErr").textContent=e.message;}
 btn.disabled=false;btn.textContent="📸 "+x.kCapture;
}
function renderKitchenResult(r){
 const x=t();
 const say=(r.benefit?r.benefit+". ":"")+(r.steps||[]).map(s=>`${s.title}. ${s.how}`).join(" ");
 const found=(r.detected&&r.detected.length)?`<div class="kfound">🔍 ${x.kFound}: ${r.detected.map(esc).join(", ")}</div>`:"";
 const bene=r.benefit?`<div class="kbenefit">✅ <b>${x.kBenefit}:</b> ${esc(r.benefit)}</div>`:"";
 const steps=(r.steps||[]).length?(r.steps||[]).map(s=>`<div class="krem"><h4>${esc(s.title)}</h4><div>${esc(s.how)}</div>${s.uses&&s.uses.length?`<div class="kuses">🧺 ${s.uses.map(esc).join(", ")}</div>`:""}</div>`).join(""):`<p class="sub">${esc(r.msg||"")}</p>`;
 $("kResult").innerHTML=`<div class="card" style="margin-top:14px"><div class="sec-h">${icn("leaf")}${esc(r.concern)}<span style="margin-left:auto;display:flex;gap:8px">${(TTS&&say)?`<button class="listen-btn" id="kSpk">🔊 ${x.listen}</button>`:""}${(r.steps&&r.steps.length)?`<button class="listen-btn" id="kShareBtn">📤 ${x.shareBtn}</button>`:""}</span></div>
   ${found}${bene}${steps}
   <div class="disc" style="margin-top:12px"><b>⚕</b> ${esc(r.caution||"")}</div></div>`;
 if(TTS&&say&&$("kSpk"))$("kSpk").onclick=()=>toggleSpeak(say);
 if($("kShareBtn"))$("kShareBtn").onclick=()=>shareRemedy(r);
 $("kResult").scrollIntoView({behavior:"smooth",block:"start"});
}
async function findRemedy(){
 const x=t();
 if(!kConcern){$("kErr").textContent=x.kPickC;return;}
 if(!kSel.size){$("kErr").textContent=x.kPickI;return;}
 $("kErr").textContent="";$("kBtn").disabled=true;$("kBtn").textContent=x.kFinding;
 try{
   const r=await api("/kitchen/remedy",{method:"POST",body:JSON.stringify({concern:kConcern,items:[...kSel],language:lang})});
   renderKitchenResult(r);
 }catch(e){$("kErr").textContent=e.message;}
 $("kBtn").disabled=false;$("kBtn").textContent=x.kFind;
}
async function scanRemedy(ev){
 const x=t();const file=ev.target.files&&ev.target.files[0];ev.target.value="";
 if(!file)return;
 if(!kConcern){$("kErr").textContent=x.kPickC;return;}
 $("kErr").textContent="";
 const btn=$("kScanBtn");btn.disabled=true;btn.textContent="📷 "+x.kScanning;
 try{
   const data=await fileToBase64(file);
   const r=await api("/kitchen/scan",{method:"POST",body:JSON.stringify({concern:kConcern,image:{media_type:file.type||"image/jpeg",data},language:lang})});
   renderKitchenResult(r);
 }catch(e){$("kErr").textContent=e.message;}
 btn.disabled=false;btn.textContent="📷 "+x.kScan;
}

/* ============ COMMUNITY (Healing Circles) ============ */
async function loadCommunity(){
 const x=t();
 $("viewCommunity").innerHTML=`
   <h1 style="font-family:var(--f-head);font-size:24px;margin:12px 0 2px">${x.cTitle}</h1>
   <p class="sub">${x.cSub}</p>
   <div class="mini-card c-season"><p class="mc-b">${x.cDisc}</p></div>
   <div class="card" style="margin-top:12px">
     <label>${x.cShare}</label>
     <input id="cPostTitle" placeholder="${x.cTitlePh}" style="margin-bottom:8px">
     <div class="inrow" style="align-items:flex-start"><textarea id="cPostBody" placeholder="${x.cBodyPh}"></textarea><button type="button" class="mic" id="cMic" aria-label="voice">${MIC_SVG}</button></div>
     <input id="cPostTag" placeholder="${x.cTagPh}" style="margin-top:8px">
     <label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13.5px;font-weight:600"><input type="checkbox" id="cAnon" style="width:auto"> ${x.cAnon}</label>
     <div class="err" id="cErr"></div>
     <button class="btn btn-primary" id="cPostBtn" style="margin-top:12px">${x.cPost}</button>
   </div>
   <div id="cFeed" style="margin-top:6px"></div>`;
 attachMic($("cMic"),$("cPostBody"));
 $("cPostBtn").onclick=submitPost;
 loadFeed();
}
async function loadFeed(){
 const x=t();
 try{const d=await api("/community/posts?language="+lang);
  if(!d.posts.length){$("cFeed").innerHTML=`<p class="sub" style="margin-top:16px;text-align:center">${x.cEmpty}</p>`;return;}
  feedPosts={};d.posts.forEach(p=>feedPosts[p.id]=p);
  $("cFeed").innerHTML=d.posts.map(p=>`<div class="post" data-post="${esc(p.id)}"><div class="ph">${esc(p.author)} · ${esc((p.created_at||"").slice(0,10))}${p.tag?` · <span class="ptag">${esc(p.tag)}</span>`:""}</div><h4>${esc(p.title)}</h4><div class="pbody">${esc(p.body)}</div><div class="pacts"><button data-like="${p.id}">❤ <span>${p.likes}</span></button><button data-pshare="${p.id}">📤 ${x.shareBtn}</button><button data-report="${p.id}">🚩 ${x.cReport}</button></div></div>`).join("");
  wireFeed();
 }catch(e){$("cFeed").innerHTML=`<p class="sub">${esc(e.message)}</p>`;}
}
function wireFeed(){
 $("cFeed").querySelectorAll("[data-like]").forEach(b=>b.onclick=async()=>{try{const r=await api("/community/posts/"+b.dataset.like+"/like",{method:"POST"});b.classList.toggle("on");b.querySelector("span").textContent=r.likes;pointToast(r);}catch(e){toast(e.message);}});
 $("cFeed").querySelectorAll("[data-report]").forEach(b=>b.onclick=async()=>{if(!confirm(t().cReportAsk))return;try{await api("/community/posts/"+b.dataset.report+"/report",{method:"POST"});toast(t().cReported);}catch(e){toast(e.message);}});
 $("cFeed").querySelectorAll("[data-pshare]").forEach(b=>b.onclick=()=>{const p=feedPosts[b.dataset.pshare];if(p)sharePostLink(p);});
 $("cFeed").querySelectorAll("[data-pdel]").forEach(b=>b.onclick=async()=>{if(!confirm(t().cDelAsk))return;try{await api("/community/posts/"+b.dataset.pdel,{method:"DELETE"});loadFeed();}catch(e){toast(e.message);}});
}
async function submitPost(){
 const x=t();const title=$("cPostTitle").value.trim();const body=$("cPostBody").value.trim();
 if(!title||!body){$("cErr").textContent=x.cFill;return;}
 $("cErr").textContent="";$("cPostBtn").disabled=true;
 try{const r=await api("/community/posts",{method:"POST",body:JSON.stringify({title,body,tag:$("cPostTag").value.trim(),anon:$("cAnon").checked,language:lang})});
   toast(r.status==="approved"?x.cPosted:(r.msg||x.cPending));pointToast(r);
   $("cPostTitle").value="";$("cPostBody").value="";$("cPostTag").value="";$("cAnon").checked=false;
   loadFeed();
 }catch(e){$("cErr").textContent=e.message;}
 $("cPostBtn").disabled=false;
}

/* ---- history ---- */
async function loadHistory(){
 try{const d=await api("/plans");const x=t();
  if(!d.plans.length){$("histList").innerHTML=`<p class="sub" style="margin:0">${x.noHist}</p>`;return;}
  $("histList").innerHTML=d.plans.map(p=>`<div class="pitem" data-id="${p.id}"><div style="flex:1;min-width:0"><div class="ti">${esc(p.title||"Plan")}</div><div class="dt">${p.source==="ai"?"AI":"offline"}</div></div><div class="dt" style="text-align:right;white-space:nowrap">${esc((p.created_at||"").replace("T"," ").slice(0,16))}</div><button class="link del" data-del="${p.id}">${x.del}</button></div>`).join("");
  $("histList").querySelectorAll(".pitem").forEach(el=>el.onclick=async(ev)=>{
   if(ev.target.dataset.del){ev.stopPropagation();await api("/plans/"+ev.target.dataset.del,{method:"DELETE"});toast(t().deleted);loadHistory();return;}
   const dd=await api("/plans/"+el.dataset.id);renderPlan(dd.plan,dd.source);toast(t().opened);
  });
 }catch(e){}
}

/* ---- boot ---- */
let deepLink={tab:"",post:""};
(function(){try{
 const u=new URL(location.href),p=u.searchParams;
 const r=p.get("ref");if(r)localStorage.setItem("nh_ref",String(r).toUpperCase().slice(0,12));
 const tab=p.get("tab");if(tab)deepLink.tab=tab;
 const post=p.get("post");if(post){deepLink.post=post;deepLink.tab="community";}
}catch(_){}})();
function applyDeepLink(){
 if(deepLink.tab){const valid=["home","plan","track","kitchen","community"];if(valid.includes(deepLink.tab))setTab(deepLink.tab);}
 if(deepLink.post){const id=deepLink.post;setTimeout(()=>{const el=document.querySelector('[data-post="'+CSS.escape(id)+'"]');if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.add("post-hl");}},700);}
 deepLink={tab:"",post:""};
}
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("/sw.js").catch(()=>{});});}
loadPublicStats();
renderStatic();
if(token)loadMe(); else showAuth();
</script>
