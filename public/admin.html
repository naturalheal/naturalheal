<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NaturalHeal Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Mulish:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#F2F5F0;--surface:#FFFFFF;--surface-2:#EAF0E8;--fg:#1E2823;--muted:#5C6B61;--line:#D9E2D6;--accent:#2E7D5B;--accent-soft:#DCEDE3;--accent-ink:#1C5A3E;--gold:#B07D22;--gold-soft:#F4E9CE;--danger:#B23A32;--shadow:0 1px 2px rgba(30,40,35,.05),0 8px 24px rgba(30,40,35,.06);--f-head:"Fraunces",Georgia,serif;--f-body:"Mulish",system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#10140F;--surface:#191E16;--surface-2:#222A1F;--fg:#E7EDE6;--muted:#9BA99F;--line:#2C3528;--accent:#58B98B;--accent-soft:#1E2D24;--accent-ink:#9FE0BE;--gold:#D7A94B;--gold-soft:#2A2415;--danger:#E6786F;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body)}
.hidden{display:none!important}
/* login */
.login-wrap{max-width:420px;margin:60px auto;padding:0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px}
h1{font-family:var(--f-head);font-weight:600;margin:0}
.sub{color:var(--muted);font-size:14px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
input,textarea.ta{width:100%;font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.btn{border:none;cursor:pointer;font-weight:800;font-size:14px;padding:11px 16px;border-radius:10px;background:var(--accent);color:#fff;font-family:var(--f-body)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.ghost{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:var(--danger)}
.err{color:var(--danger);font-weight:600;font-size:13px;margin-top:10px;min-height:1px}
/* shell */
.shell{display:flex;height:100%}
.rail{width:66px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px}
.rail .logo{width:40px;height:40px;border-radius:12px;background:var(--accent);display:grid;place-items:center;margin-bottom:10px}
.rail .logo svg{width:22px;height:22px}
.navbtn{width:46px;height:46px;border-radius:12px;border:none;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;position:relative}
.navbtn svg{width:22px;height:22px}
.navbtn:hover{background:var(--surface-2)}
.navbtn.on{background:var(--accent-soft);color:var(--accent-ink)}
.navbtn .tip{position:absolute;left:54px;top:50%;transform:translateY(-50%);background:var(--fg);color:var(--bg);font-size:11px;font-weight:700;padding:4px 8px;border-radius:7px;white-space:nowrap;opacity:0;pointer-events:none;transition:.12s;z-index:5}
.navbtn:hover .tip{opacity:1}
.rail .spacer{flex:1}
.main{flex:1;overflow-y:auto;padding:24px}
.main-h{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.main-h .ic{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center}
.main-h .ic svg{width:19px;height:19px}
.main-h h1{font-size:22px}
.wrapx{max-width:920px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.stat .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
.stat .k svg{width:14px;height:14px}
.stat .v{font-size:28px;font-weight:800;font-family:var(--f-head);margin-top:4px}
.stat .v.sm{font-size:17px}
/* table */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.scroll{overflow-x:auto}
.pill{font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;text-transform:uppercase}
.pill.premium{background:var(--accent-soft);color:var(--accent-ink)}
.pill.free{background:var(--surface-2);color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.right{margin-left:auto}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;z-index:50}
.bar{height:8px;background:var(--surface-2);border-radius:5px;overflow:hidden;min-width:60px}
.bar > i{display:block;height:100%;background:var(--accent)}
.field{margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.two{grid-template-columns:1fr}.main{padding:16px}}
select{width:100%;font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.modal-bg{position:fixed;inset:0;background:rgba(20,26,22,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);width:100%;max-width:560px;border-radius:16px;padding:20px;max-height:85vh;overflow-y:auto}
.modal h3{font-family:var(--f-head);font-size:19px;margin:0 0 12px}
.mrow{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView" class="login-wrap">
  <div class="card">
    <h1 style="font-size:20px">Admin login</h1>
    <p class="sub">Admin email se login karein.</p>
    <div class="field"><label>Email</label><input id="email" type="email"></div>
    <div class="field"><label>Password</label><div style="position:relative"><input id="pass" type="password" style="padding-right:58px"><button type="button" id="peye" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);font-weight:700;font-size:13px;padding:4px">Show</button></div></div>
    <div class="err" id="err"></div>
    <button class="btn" id="loginBtn" style="width:100%">Login</button>
    <p class="sub" style="text-align:center;margin-top:14px"><a href="/app" style="color:var(--accent);font-weight:700;text-decoration:none">← App</a></p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dash" class="shell hidden">
  <div class="rail" id="rail">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/></svg></div>
    <div id="navBtns"></div>
    <div class="spacer"></div>
    <button class="navbtn" id="logout" title="Logout"><span class="tip">Logout</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
  </div>
  <div class="main">
    <div class="main-h"><div class="ic" id="secIc"></div><h1 id="secTitle"></h1></div>
    <div class="wrapx" id="secBody"></div>
  </div>
</div>
<div id="toastRoot"></div>
<div id="modalRoot"></div>

<script>
const API="/api";
let token=localStorage.getItem("nh_admin_token")||null;
const $=id=>document.getElementById(id);
function toast(m){const e=document.createElement("div");e.className="toast";e.textContent=m;$("toastRoot").appendChild(e);setTimeout(()=>e.remove(),2000);}
async function api(p,o={}){const h={"Content-Type":"application/json"};if(token)h.Authorization="Bearer "+token;
 const r=await fetch(API+p,{...o,headers:{...h,...(o.headers||{})}});const d=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(d.error||"Error");return d;}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* icons */
const IC={
 overview:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM13 3v6h8V3zM3 21h8v-6H3z"/>',
 users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
 pay:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
 plans:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8ZM14 2v6h6M9 13h6M9 17h4"/>',
 symptoms:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
 members:'<path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2M16 3.13a4 4 0 0 1 0 7.75M22 21v-2a4 4 0 0 0-3-3.87"/>',
 settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>',
 community:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/>',
 referral:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/>',
 points:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h4a1.5 1.5 0 0 1 0 3h-3a1.5 1.5 0 0 0 0 3h4"/>',
};
function svg(name){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[name]}</svg>`;}
const SECTIONS=[
 {key:"overview",title:"Overview",icon:"overview"},
 {key:"users",title:"Users",icon:"users"},
 {key:"pay",title:"Payments",icon:"pay"},
 {key:"upi",title:"Payment requests (UPI)",icon:"pay"},
 {key:"plans",title:"Plans report",icon:"plans"},
 {key:"symptoms",title:"Symptoms report",icon:"symptoms"},
 {key:"members",title:"Family members",icon:"members"},
 {key:"community",title:"Community (moderation)",icon:"community"},
 {key:"referral",title:"Referral / Sharing",icon:"referral"},
 {key:"points",title:"Healing Points",icon:"points"},
 {key:"settings",title:"Settings (edit)",icon:"settings"},
];

/* login */
$("loginBtn").onclick=async()=>{$("err").textContent="";
 try{const d=await api("/auth/login",{method:"POST",body:JSON.stringify({email:$("email").value.trim(),password:$("pass").value})});
  token=d.token;const me=await api("/me",{headers:{Authorization:"Bearer "+token}});
  if(!me.user.is_admin){$("err").textContent="Ye account admin nahi hai.";token=null;return;}
  localStorage.setItem("nh_admin_token",token);boot();
 }catch(e){$("err").textContent=e.message;}};
$("logout").onclick=()=>{token=null;localStorage.removeItem("nh_admin_token");location.reload();};
$("peye").onclick=()=>{const i=$("pass");const sh=i.type==="password";i.type=sh?"text":"password";$("peye").textContent=sh?"Hide":"Show";};

function boot(){
 $("loginView").classList.add("hidden");$("dash").classList.remove("hidden");
 $("navBtns").innerHTML=SECTIONS.map(s=>`<button class="navbtn" data-sec="${s.key}" title="${s.title}"><span class="tip">${s.title}</span>${svg(s.icon)}</button>`).join("");
 $("navBtns").querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>show(b.dataset.sec));
 show("overview");
}
function show(key){
 const s=SECTIONS.find(x=>x.key===key);
 $("navBtns").querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("on",b.dataset.sec===key));
 $("secIc").innerHTML=svg(s.icon);$("secTitle").textContent=s.title;
 $("secBody").innerHTML='<p class="sub">Loading…</p>';
 ({overview:secOverview,users:secUsers,pay:secPay,upi:secUpi,plans:secPlans,symptoms:secSymptoms,members:secMembers,community:secCommunity,referral:secReferral,points:secPoints,settings:secSettings}[key])();
}

/* ===== sections ===== */
async function secOverview(){
 const s=await api("/admin/stats");
 const rev=(s.revenue||[]).map(r=>`${r.currency||""} ${(r.total||0).toFixed(0)}`).join(" · ")||"—";
 const card=(ic,k,v,sm)=>`<div class="stat"><div class="k">${svg(ic)}${k}</div><div class="v ${sm?'sm':''}">${v}</div></div>`;
 $("secBody").innerHTML=`<div class="stats">
  ${card("users","Total users",s.totalUsers)}
  ${card("users","Premium",s.premium)}
  ${card("users","Free",s.free)}
  ${card("users","New this month",s.newThisMonth)}
  ${card("plans","Plans generated",s.plans)}
  ${card("symptoms","Symptom logs",s.symptoms)}
  ${card("members","Members",s.members)}
  ${card("pay","Revenue",esc(rev),true)}
 </div>`;
}
async function secUsers(){
 const d=await api("/admin/users");
 $("secBody").innerHTML=`<div class="row" style="margin-bottom:12px"><input id="uq" placeholder="Search naam/email…" style="max-width:260px"></div><div class="scroll"><table><thead><tr><th>Name</th><th>Email</th><th>Region</th><th>Plan</th><th>Joined</th><th>Expires</th><th>Action</th></tr></thead><tbody id="ur"></tbody></table></div>`;
 const draw=(users)=>{$("ur").innerHTML=users.map(u=>{const prem=u.plan==="premium"&&u.plan_status==="active";
  return `<tr><td>${esc(u.name)}${u.is_admin?' <span class="pill premium">admin</span>':''}</td><td>${esc(u.email)}</td><td>${esc(u.region||"")}</td><td><span class="pill ${prem?"premium":"free"}">${prem?"premium":"free"}</span></td><td>${esc((u.created_at||"").slice(0,10))||"—"}</td><td>${esc((u.plan_expires||"").slice(0,10))||"—"}</td><td><div class="row">${prem?`<button class="btn ghost sm" data-off="${u.id}">Remove premium</button>`:`<button class="btn sm" data-on="${u.id}">Give premium</button>`}<button class="btn ghost sm" data-mem="${u.id}" data-mn="${esc(u.name)}">Members</button><button class="btn ghost sm" data-pw="${u.id}">Password</button>${u.is_admin?"":`<button class="btn danger sm" data-del="${u.id}">Delete</button>`}</div></td></tr>`;}).join("")||`<tr><td colspan="7" class="sub">Koi user nahi</td></tr>`;
  $("ur").querySelectorAll("[data-pw]").forEach(b=>b.onclick=()=>setPw(b.dataset.pw));
  $("ur").querySelectorAll("[data-on]").forEach(b=>b.onclick=()=>setPrem(b.dataset.on,true));
  $("ur").querySelectorAll("[data-off]").forEach(b=>b.onclick=()=>setPrem(b.dataset.off,false));
  $("ur").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>delUser(b.dataset.del));
  $("ur").querySelectorAll("[data-mem]").forEach(b=>b.onclick=()=>openUserMembers(b.dataset.mem,b.dataset.mn));};
 draw(d.users);
 let tmr;$("uq").oninput=e=>{clearTimeout(tmr);tmr=setTimeout(async()=>{const r=await api("/admin/users?q="+encodeURIComponent(e.target.value));draw(r.users);},300);};
}
async function setPrem(id,on){await api("/admin/users/"+id+"/premium",{method:"POST",body:JSON.stringify({on,days:31})});toast(on?"Premium diya ✓":"Premium hataya");secUsers();}
async function setPw(id){
 const pw=prompt("Is user ke liye NAYA password (kam se kam 6 akshar). Ye user ko bata dein:");
 if(pw===null)return;
 if(pw.length<6){toast("Password 6 akshar se bada ho");return;}
 try{await api("/admin/users/"+id+"/password",{method:"POST",body:JSON.stringify({password:pw})});toast("Naya password set ho gaya ✓ User ko bata dein");}
 catch(e){toast(e.message);}
}
async function delUser(id){if(!confirm("Pakka is user ko delete karna hai? Uska saara data (plans, symptoms, members) mit jaayega."))return;try{await api("/admin/users/"+id,{method:"DELETE"});toast("User delete ho gaya");secUsers();}catch(e){toast(e.message);}}
function openModal(html){$("modalRoot").innerHTML=`<div class="modal-bg" id="mbg"><div class="modal">${html}</div></div>`;$("mbg").onclick=e=>{if(e.target.id==="mbg")closeModal();};}
function closeModal(){$("modalRoot").innerHTML="";}
function genSel(v){const o=[["","—"],["male","Purush"],["female","Mahila"],["other","Anya"]];return o.map(([val,lbl])=>`<option value="${val}" ${v===val?"selected":""}>${lbl}</option>`).join("");}
async function openUserMembers(id,name){
 try{const d=await api("/admin/users/"+id+"/members");
  const rows=d.members.map(m=>`<div class="mrow" data-mid="${m.id}">
    <div class="two"><div><label>Naam</label><input class="mN" value="${esc(m.name)}" ${m.relation==="self"?"":""}></div><div><label>Rishta</label><input class="mR" value="${esc(m.relation||"")}" ${m.relation==="self"?"disabled":""}></div></div>
    <div class="two" style="margin-top:8px"><div><label>Ling</label><select class="mG">${genSel(m.gender||"")}</select></div><div><label>Umar</label><input class="mA" type="number" value="${m.age||""}"></div></div>
    <div class="row" style="margin-top:10px"><button class="btn sm" data-save="${m.id}">Save</button>${m.relation==="self"?'<span class="pill premium">self</span>':`<button class="btn danger sm" data-mdel="${m.id}">Delete</button>`}</div>
   </div>`).join("")||'<p class="sub">Koi member nahi.</p>';
  openModal(`<h3>${esc(name)} ke members</h3>${rows}<button class="btn ghost" id="mClose" style="width:100%;margin-top:6px">Band karein</button>`);
  $("mClose").onclick=closeModal;
  $("modalRoot").querySelectorAll("[data-save]").forEach(b=>b.onclick=async()=>{const r=b.closest(".mrow");
   try{await api("/admin/members/"+b.dataset.save,{method:"PUT",body:JSON.stringify({name:r.querySelector(".mN").value,relation:r.querySelector(".mR").value,gender:r.querySelector(".mG").value,age:+r.querySelector(".mA").value||null})});toast("Save ho gaya ✓");}catch(e){toast(e.message);}});
  $("modalRoot").querySelectorAll("[data-mdel]").forEach(b=>b.onclick=async()=>{if(!confirm("Is member ko delete karein?"))return;try{await api("/admin/members/"+b.dataset.mdel,{method:"DELETE"});openUserMembers(id,name);}catch(e){toast(e.message);}});
 }catch(e){toast(e.message);}
}
async function secPay(){
 const d=await api("/admin/payments");
 $("secBody").innerHTML=`<div class="scroll"><table><thead><tr><th>User</th><th>Amount</th><th>Provider</th><th>Status</th><th>Date</th></tr></thead><tbody>${d.payments.map(p=>`<tr><td>${esc(p.name)}<br><span class="sub" style="font-size:12px">${esc(p.email)}</span></td><td>${esc(p.currency||"")} ${p.amount!=null?p.amount:""}</td><td>${esc(p.provider||"")}</td><td>${esc(p.status||"")}</td><td>${esc((p.created_at||"").replace("T"," ").slice(0,16))}</td></tr>`).join("")||`<tr><td colspan="5" class="sub">Abhi koi payment nahi</td></tr>`}</tbody></table></div>`;
}
async function secUpi(){
 const d=await api("/admin/upi");const rows=d.payments||[];
 $("secBody").innerHTML=`<p class="sub" style="margin:0 0 12px">User UPI se pay karke UTR daalta hai. Apni UPI/bank app me paisa aaya check karke <b>Approve</b> karo. Pending: <b>${d.pending||0}</b></p><div class="scroll"><table><thead><tr><th>User</th><th>Amount</th><th>UTR</th><th>Status</th><th>Time</th><th>Action</th></tr></thead><tbody id="upr"></tbody></table></div>`;
 $("upr").innerHTML=rows.map(p=>`<tr><td>${esc(p.user_name||"")}<div class="sub" style="font-size:12px">${esc(p.user_email||"")}</div></td><td>₹${p.amount||0}</td><td style="font-family:monospace">${esc(p.utr)}</td><td><span class="pill ${p.status==="approved"?"premium":"free"}">${esc(p.status)}</span></td><td class="sub">${esc((p.created_at||"").replace("T"," ").slice(0,16))}</td><td>${p.status==="pending"?`<div class="row"><button class="btn sm" data-ap="${p.id}">Approve</button><button class="btn ghost sm" data-rj="${p.id}">Reject</button></div>`:"—"}</td></tr>`).join("")||`<tr><td colspan="6" class="sub">Koi request nahi</td></tr>`;
 $("upr").querySelectorAll("[data-ap]").forEach(b=>b.onclick=async()=>{try{await api("/admin/upi/"+b.dataset.ap,{method:"POST",body:JSON.stringify({action:"approve"})});toast("Approve ✓ Premium chalu");secUpi();}catch(e){toast(e.message);}});

  <h3 style="font-family:var(--f-head);font-weight:600;font-size:16px;margin:0 0 6px">🩺 Bimariyan / Samasyaein</h3>
  <p class="sub" style="margin:0 0 10px">Nayi samasya add karo — sabhi users ko chip ke roop me dikhegi. Jab koi user apni alag samasya likhega, vo bhi yahin aa jayegi. AI usi samasya ko samajh kar holistic salah deta hai.</p>
  <div id="concList"></div>
  <div style="display:flex;gap:8px;margin-top:10px">
    <input id="newConc" placeholder="Nayi samasya (jaise: Migraine)" maxlength="40" style="flex:1">
    <button class="btn" id="addConc" style="min-width:86px">+ Add</button>
  </div>
 </div>
 <div class="card" style="max-width:560px;margin-top:16px">
  <h3 style="font-family:var(--f-head);font-weight:600;font-size:16px;margin:0 0 6px">💾 Roz ka automatic backup</h3>
  <p class="sub" style="margin:0 0 10px">Har raat ~3 baje (IST) poore data ka backup apne-aap banta hai aur 3 jagah jaata hai: Upstash (30 din), aapka Telegram (file), aur server disk. Kuch gadbad ho to neeche se kisi bhi din ka backup wapas laga sakte hain.</p>
  <details style="margin:0 0 12px;border:1px solid #e5e5e5;border-radius:10px;padding:8px 10px" ${s.backup_email?"":"open"}><summary style="cursor:pointer;font-weight:700">📧 Email par bhi roz backup ${s.backup_email?"— "+esc(s.backup_email):"(set karein)"}</summary>
   <div class="field" style="margin-top:8px"><label>Backup kis email par aaye</label><input id="mlTo" type="email" value="${esc(s.backup_email||"")}" placeholder="aapka@gmail.com"></div>
   <div class="field"><label>Email kaise bhejein</label><select id="mlProv"><option value="resend" ${s.mail_provider!=="smtp"?"selected":""}>Resend (sujhav — free, sabse pakka)</option><option value="smtp" ${s.mail_provider==="smtp"?"selected":""}>Gmail / SMTP (App password)</option></select></div>
   <div id="mlResend">
    <div class="field"><label>Resend API key</label><input id="mlKey" value="${esc(s.resend_api_key||"")}" placeholder="re_xxxxxxxx"></div>
    <p class="sub" style="margin:0 0 8px;font-size:12px">resend.com par free account banayein → API Keys → key copy karein. Jis email se Resend account banaya, <b>wahi email</b> upar daalein (domain ki zaroorat nahi). Doosre email par bhejna ho to Resend me apna domain verify karke "From" bharein.</p>
    <div class="field"><label>From (optional)</label><input id="mlFrom" value="${esc(s.mail_from||"")}" placeholder="NaturalHeal &lt;backup@aapka-domain.com&gt;"></div>
   </div>
   <div id="mlSmtp">
    <div class="field"><label>SMTP host</label><input id="mlHost" value="${esc(s.smtp_host||"smtp.gmail.com")}"></div>
    <div class="field"><label>Port</label><input id="mlPort" type="number" value="${s.smtp_port||465}"></div>
    <div class="field"><label>Email / username</label><input id="mlUser" value="${esc(s.smtp_user||"")}" placeholder="aapka@gmail.com"></div>
    <div class="field"><label>Password (Gmail: App password)</label><input id="mlPass" value="${esc(s.smtp_pass||"")}" placeholder="16 akshar ka app password"></div>
    <p class="sub" style="margin:0 0 8px;font-size:12px">Gmail: Google Account → Security → 2-Step Verification on → "App passwords" → naya banayein. Dhyaan: kuch free hosting (Render free bhi) SMTP port band rakhti hai — na chale to Resend use karein.</p>
   </div>
   <button class="btn" id="mlSave" style="width:auto">💾 Save + test email bhejo</button>
   <div id="mlMsg" class="sub" style="margin-top:6px"></div>
  </details>
  <div id="bkStatus" class="sub" style="margin:0 0 10px">…</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
   <button class="btn" id="bkRun" style="width:auto">⏺ Abhi backup lo</button>
   <button class="btn ghost" id="rBackup" style="width:auto">⬇️ Abhi ka data download</button>
  </div>
  <div id="bkList" style="margin-top:12px"></div>
  <details style="margin-top:12px"><summary style="cursor:pointer;font-weight:700">♻️ File se restore (.json.gz / .json)</summary>
   <p class="sub" style="margin:8px 0">Download ya Telegram wali backup file chunein. Restore se pehle abhi ka data bhi apne-aap backup ho jaata hai.</p>
   <input type="file" id="bkFile" accept=".gz,.json,application/gzip,application/json">
   <button class="btn" id="bkFileGo" style="width:auto;margin-top:8px;background:#c0392b;border-color:#c0392b;color:#fff">Is file se restore karo</button>
  </details>
  <div class="err" id="bkErr"></div>
 </div>
 <div class="card" style="max-width:560px;margin-top:16px;border:1.5px solid #e0b4b4">
  <h3 style="font-family:var(--f-head);font-weight:600;font-size:16px;margin:0 0 6px;color:#c0392b">⚠ Fresh start (launch se pehle)</h3>
  <p class="sub" style="margin:0 0 10px">Testing ka <b>saara data</b> (users, plans, logs, points, community) hamesha ke liye delete ho jayega — sirf aapka admin account bachega. Ye sirf <b>launch se theek pehle</b> ek baar dabayein.</p>
  <div class="err" id="rErr"></div>
  <button class="btn" id="rReset" style="width:100%;background:#c0392b;border-color:#c0392b;color:#fff">Saara test data clear karo</button>
 </div>`;
 // ---- roz ka backup
 const bkKB=n=>n?(n/1024).toFixed(0)+" KB":"";
 async function bkDownload(name){try{const r=await fetch("/api/admin/backups/download"+(name?"?name="+encodeURIComponent(name):""),{headers:{Authorization:"Bearer "+token}});if(!r.ok)throw new Error("HTTP "+r.status);const b=await r.blob();const u=URL.createObjectURL(b),el=document.createElement("a");el.href=u;el.download="naturalheal-backup-"+(name||new Date().toISOString().slice(0,10))+".json.gz";document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);}catch(err){$("bkErr").textContent=err.message;}}
 async function bkRestore(body){$("bkErr").textContent="";const c=prompt("Restore se ABHI ka data is backup se badal jayega (pehle abhi wala bhi backup hoga). Pakka? Likhein: RESTORE");if(c!=="RESTORE")return;try{const r=await api("/admin/backups/restore",{method:"POST",body:JSON.stringify({...body,confirm:"RESTORE"})});alert("Restore ho gaya ✓ Users: "+(r.counts.users||0)+", plans: "+(r.counts.ai_plans||0));location.reload();}catch(err){$("bkErr").textContent=err.message;}}
 async function bkLoad(){try{const d=await api("/admin/backups");const st=d.status||{};const w=d.where||{};
  $("bkStatus").innerHTML=(st.last_ok?"✅ Aakhri backup: <b>"+esc(new Date(st.last_ok).toLocaleString("en-IN"))+"</b>"+(st.size?" · "+bkKB(st.size):""):"⏳ Abhi tak koi backup nahi (server chalu hone ke kuch der baad aur roz "+d.hour_ist+":00 IST par banta hai)")
   +"<br>Kahan jaata hai: Upstash "+(w.upstash?"✅":"❌ (env set nahi)")+" · Telegram "+(w.telegram?"✅":"❌ (upar Telegram bot token + chat id bharein)")+" · Email "+(w.email?"✅ "+esc(w.email):"❌ (upar email set karein)")+" · Disk "+(w.disk?"✅":"➖ (free host par temporary)")
   +(st.last_error?"<br><span style='color:#c0392b'>⚠ "+esc(st.last_error)+"</span>":"")+(st.sent&&st.sent.telegram_err?"<br><span style='color:#c0392b'>Telegram: "+esc(st.sent.telegram_err)+"</span>":"")+(st.sent&&st.sent.email_err?"<br><span style='color:#c0392b'>Email: "+esc(st.sent.email_err)+"</span>":"")+(st.sent&&st.sent.upstash_err?"<br><span style='color:#c0392b'>Upstash: "+esc(st.sent.upstash_err)+"</span>":"");
  $("bkList").innerHTML=(d.list||[]).length?"<b style='font-size:13px'>Purane backup ("+d.keep_days+" din tak):</b>"+d.list.slice(0,30).map(x=>"<div style='display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;padding:6px 0;font-size:13px'><span>"+esc(x.name)+" <span style='color:#777'>"+bkKB(x.size)+(x.counts?" · users "+(x.counts.users||0):"")+"</span></span><span style='display:flex;gap:6px'><button class='btn ghost' style='width:auto;padding:5px 10px' data-bkd='"+esc(x.name)+"'>⬇️</button><button class='btn ghost' style='width:auto;padding:5px 10px;color:#c0392b' data-bkr='"+esc(x.name)+"'>♻️ Restore</button></span></div>").join(""):"<p class='sub' style='margin:0'>Abhi koi purana backup nahi.</p>";
  document.querySelectorAll("[data-bkd]").forEach(b=>b.onclick=()=>bkDownload(b.dataset.bkd));
  document.querySelectorAll("[data-bkr]").forEach(b=>b.onclick=()=>bkRestore({name:b.dataset.bkr}));
 }catch(err){$("bkStatus").textContent=err.message;}}
 const mlToggle=()=>{const smtp=$("mlProv").value==="smtp";$("mlSmtp").style.display=smtp?"":"none";$("mlResend").style.display=smtp?"none":"";};
 $("mlProv").onchange=mlToggle;mlToggle();
 $("mlSave").onclick=async()=>{const b=$("mlSave"),m=$("mlMsg");b.disabled=true;m.style.color="";m.textContent="Save ho raha hai…";
  try{await api("/admin/settings",{method:"PUT",body:JSON.stringify({backup_email:$("mlTo").value.trim(),mail_provider:$("mlProv").value,resend_api_key:$("mlKey").value.trim(),mail_from:$("mlFrom").value.trim(),smtp_host:$("mlHost").value.trim(),smtp_port:$("mlPort").value,smtp_user:$("mlUser").value.trim(),smtp_pass:$("mlPass").value})});
   m.textContent="Test email bhej rahe hain…";await api("/admin/mail-test",{method:"POST",body:"{}"});m.style.color="#1C5A3E";m.textContent="✅ Test email chala gaya — inbox (aur spam) dekh lein. Ab roz ka backup isi par aayega.";bkLoad();}
  catch(err){m.style.color="#c0392b";m.textContent="❌ "+err.message;}b.disabled=false;};
 bkLoad();
 $("bkRun").onclick=async()=>{const b=$("bkRun");b.disabled=true;b.textContent="Backup ho raha hai…";try{await api("/admin/backups/run",{method:"POST",body:"{}"});await bkLoad();}catch(err){$("bkErr").textContent=err.message;}b.disabled=false;b.textContent="⏺ Abhi backup lo";};
 $("bkFileGo").onclick=async()=>{const f=$("bkFile").files[0];if(!f){$("bkErr").textContent="Pehle file chunein";return;}const buf=new Uint8Array(await f.arrayBuffer());let s="";for(let i=0;i<buf.length;i+=32768)s+=String.fromCharCode.apply(null,buf.subarray(i,i+32768));bkRestore({file_b64:btoa(s)});};
 $("rBackup").onclick=()=>bkDownload("");
 $("rReset").onclick=async()=>{
   if(!confirm("Pakka? Saara test data delete ho jayega (sirf admin account bachega). Ye wapas nahi aayega."))return;
   const code=prompt("Confirm karne ke liye bade akshar me  RESET  likhein:");
   if(code!=="RESET"){toast("Cancel — RESET nahi likha");return;}
   try{await api("/admin/reset-data",{method:"POST",body:JSON.stringify({confirm:"RESET"})});toast("Saaf ho gaya ✓ Ab fresh start!");}
   catch(e){$("rErr").textContent=e.message;}
 };
 let concs=(s.custom_concerns||[]);
 function renderConc(){const el=$("concList");if(!el)return;
   el.innerHTML=concs.length?concs.map(c=>`<span class="pill" style="display:inline-flex;align-items:center;gap:6px;margin:3px 5px 3px 0">${esc(c.label)} <button data-cdel="${c.id}" class="link" style="color:#c0392b;font-weight:800;padding:0">✕</button></span>`).join(""):`<p class="sub" style="margin:0">Abhi koi extra samasya nahi.</p>`;
   el.querySelectorAll("[data-cdel]").forEach(b=>b.onclick=async()=>{try{const r=await api("/admin/concerns/"+b.dataset.cdel,{method:"DELETE"});concs=r.custom_concerns||[];renderConc();}catch(e){toast(e.message);}});
 }
 renderConc();
 if($("addConc"))$("addConc").onclick=async()=>{const v=($("newConc").value||"").trim();if(!v)return;try{const r=await api("/admin/concerns",{method:"POST",body:JSON.stringify({label:v})});concs=r.custom_concerns||concs;$("newConc").value="";renderConc();toast("Add ho gaya ✓");}catch(e){toast(e.message);}};
 if($("tgTest"))$("tgTest").onclick=async()=>{try{await api("/admin/settings",{method:"PUT",body:JSON.stringify({telegram_bot_token:$("sTgTok").value.trim(),telegram_chat_id:$("sTgChat").value.trim()})});await api("/admin/notify-test",{method:"POST",body:JSON.stringify({})});toast("Test message bhej diya ✓ Telegram dekho");}catch(e){toast(e.message);}};
 function trErrHtml(r){const e=r.tr_errors||[];return e.length?"<br><br><b>Bhasha-anuvaad ki aakhri galtiyan:</b><br>"+e.map(x=>esc((x.at||"").slice(0,16).replace("T"," ")+" · "+(x.lang||"")+" · "+(x.keys||"")+" · "+(x.status?"HTTP "+x.status+" ":"")+(x.stop_reason||"")+" "+(x.error||""))).join("<br>"):"<br><span style='color:#555'>Bhasha-anuvaad: koi galti nahi.</span>";}
if($("aiTest"))$("aiTest").onclick=async()=>{const b=$("aiTest"),o=$("aiTestOut");b.disabled=true;o.style.color="";o.textContent="Test ho raha hai…";try{const r=await api("/admin/ai-test",{method:"POST",body:JSON.stringify({})});if(r.ok){o.style.color="#1C5A3E";o.innerHTML="✅ AI poora plan bana raha hai — premium/admin ko asli AI plan milega. (model: <b>"+esc(r.model||"")+"</b>)"+(r.summary?"<br><span style='color:#555'>Namoona: “"+esc(r.summary)+"…”</span>":"")+trErrHtml(r);}else{o.style.color="#b00020";o.innerHTML="❌ AI nahi chala"+(r.status?" (HTTP "+r.status+")":"")+":<br><b>"+esc(r.error||"unknown")+"</b><br>model: "+esc(r.model||"")+"<br><span style='color:#555'>Ye error mujhe bhej dena.</span>";}}catch(e){o.style.color="#b00020";o.textContent=e.message;}b.disabled=false;};
 $("sSave").onclick=async()=>{try{
   const pk=["referral","plan","profile","post","log","share","like","member","member_max_awards","share_daily_cap","like_daily_cap","redeem_premium_month","rupee_per_point","product_min_points"];
   const points={};pk.forEach(k=>{const el=$("pt_"+k);if(el)points[k]=el.value;});
   await api("/admin/settings",{method:"PUT",body:JSON.stringify({app_name:$("sName").value,price_inr:$("sInr").value,price_usd:$("sUsd").value,free_plan_limit:$("sLimit").value,premium_plans_per_day:$("sPpd").value,premium_emergency_per_day:$("sPem").value,premium_plans_per_month:$("sPpm").value,fit_ai_days:$("sFitDays").value,upi_id:$("sUpiId").value,upi_name:$("sUpiName").value,upi_auto_approve:$("sUpiAuto").checked,telegram_bot_token:$("sTgTok").value,telegram_chat_id:$("sTgChat").value,premium_blurb_hi:$("sBhi").value,premium_blurb_en:$("sBen").value,app_url:$("sUrl").value,share_tagline_hi:$("sTagHi").value,share_tagline_en:$("sTagEn").value,share_taglines:(()=>{const m={};["hi","bn","mr","gu","ta","te","kn","pa","ml"].forEach(k=>{const el=$("sTag_"+k);if(el)m[k]=el.value;});return m;})(),invite_video:$("sVid").value,points,coupon_enabled:$("sCoupon").checked})});
   toast("Settings save ho gayi ✓");
  }catch(e){$("sErr").textContent=e.message;}};
}
function ptField(label,key,val){return `<div class="field"><label>${label}</label><input id="pt_${key}" type="number" step="any" value="${val!=null?val:0}"></div>`;}

/* boot */
if(token){api("/me").then(me=>{if(me.user.is_admin)boot();else{token=null;localStorage.removeItem("nh_admin_token");}}).catch(()=>{token=null;localStorage.removeItem("nh_admin_token");});}
</script>
</body>
</html>
